networks:
  autoprivilege-test:
    driver: bridge
    ipam:
      config:
        # Override when 172.28.0.0/16 collides with an existing lab network:
        #   AUTOPRIV_SUBNET=172.30.0.0/16 docker compose up -d
        - subnet: ${AUTOPRIV_SUBNET:-172.28.0.0/16}

services:
  # Vulnerable system — full attack surface (10 deliberate flaws)
  vulnerable:
    build:
      context: ..
      dockerfile: docker/Dockerfile.vulnerable
    container_name: autoprivilege-vulnerable
    networks:
      - autoprivilege-test
    privileged: true

  # Clean system — no vulnerabilities; must report ZERO exploitable findings
  clean:
    build:
      context: ..
      dockerfile: docker/Dockerfile.clean
    container_name: autoprivilege-clean
    networks:
      - autoprivilege-test

  # Edge cases system — 8 tricky configurations, all must be detected
  edgecases:
    build:
      context: ..
      dockerfile: docker/Dockerfile.edgecases
    container_name: autoprivilege-edgecases
    networks:
      - autoprivilege-test
    cap_add:
      - SYS_ADMIN
