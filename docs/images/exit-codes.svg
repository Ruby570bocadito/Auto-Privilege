<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="430" viewBox="0 0 1240 430" font-family="Menlo,Consolas,'DejaVu Sans Mono',monospace">
  <defs>
    <marker id="ax" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b949e"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="1238" height="428" rx="14" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <text x="40" y="52" fill="#e6edf3" font-size="24" font-weight="bold">AUTOPRIV — exit codes, decided last, in this order</text>
  <text x="40" y="78" fill="#8b949e" font-size="14">computeExitCode: a pure function over the final run state — testable, documented, stable across releases</text>

  <!-- decision chain -->
  <g font-size="13">
    <rect x="46" y="120" width="180" height="70" rx="10" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    <text x="136" y="150" fill="#e6edf3" text-anchor="middle" font-weight="bold">run finished</text>
    <text x="136" y="172" fill="#8b949e" text-anchor="middle" font-size="11">reports already written</text>

    <line x1="226" y1="155" x2="274" y2="155" stroke="#8b949e" stroke-width="2" marker-end="url(#ax)"/>

    <rect x="278" y="120" width="200" height="70" rx="10" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    <text x="378" y="150" fill="#e6edf3" text-anchor="middle" font-weight="bold">flags parsed?</text>
    <text x="378" y="172" fill="#8b949e" text-anchor="middle" font-size="11">bad flag / bad value / bad path</text>

    <rect x="278" y="240" width="200" height="56" rx="10" fill="#2d1a03" stroke="#f0883e" stroke-width="2"/>
    <text x="378" y="274" fill="#f0883e" text-anchor="middle" font-weight="bold">exit 2 — usage error</text>
    <line x1="378" y1="190" x2="378" y2="236" stroke="#f0883e" stroke-width="2" marker-end="url(#ax)"/>
    <text x="392" y="220" fill="#f0883e" font-size="12">no</text>

    <line x1="478" y1="155" x2="526" y2="155" stroke="#8b949e" stroke-width="2" marker-end="url(#ax)"/>
    <text x="490" y="146" fill="#8b949e" font-size="12">yes</text>

    <rect x="530" y="120" width="200" height="70" rx="10" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    <text x="630" y="150" fill="#e6edf3" text-anchor="middle" font-weight="bold">--exploit ran?</text>
    <text x="630" y="172" fill="#8b949e" text-anchor="middle" font-size="11">and root was NOT obtained</text>

    <rect x="530" y="240" width="200" height="56" rx="10" fill="#2a2105" stroke="#d29922" stroke-width="2"/>
    <text x="630" y="274" fill="#d29922" text-anchor="middle" font-weight="bold">exit 1 — no root</text>
    <line x1="630" y1="190" x2="630" y2="236" stroke="#d29922" stroke-width="2" marker-end="url(#ax)"/>
    <text x="644" y="220" fill="#d29922" font-size="12">yes</text>

    <line x1="730" y1="155" x2="778" y2="155" stroke="#8b949e" stroke-width="2" marker-end="url(#ax)"/>

    <rect x="782" y="120" width="216" height="70" rx="10" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    <text x="890" y="146" fill="#e6edf3" text-anchor="middle" font-weight="bold">a gate tripped?</text>
    <text x="890" y="166" fill="#8b949e" text-anchor="middle" font-size="11">--fail-on · --fail-on-new · --min-score</text>
    <text x="890" y="184" fill="#8b949e" text-anchor="middle" font-size="11">(posture gate checked last)</text>

    <rect x="782" y="240" width="216" height="56" rx="10" fill="#2d1214" stroke="#f85149" stroke-width="2"/>
    <text x="890" y="274" fill="#f85149" text-anchor="middle" font-weight="bold">exit 3 — gate wins</text>
    <line x1="890" y1="190" x2="890" y2="236" stroke="#f85149" stroke-width="2" marker-end="url(#ax)"/>
    <text x="904" y="220" fill="#f85149" font-size="12">yes</text>

    <line x1="998" y1="155" x2="1046" y2="155" stroke="#8b949e" stroke-width="2" marker-end="url(#ax)"/>

    <rect x="1050" y="120" width="142" height="70" rx="10" fill="#12261e" stroke="#3fb950" stroke-width="2"/>
    <text x="1121" y="150" fill="#3fb950" text-anchor="middle" font-weight="bold">exit 0</text>
    <text x="1121" y="172" fill="#8b949e" text-anchor="middle" font-size="11">root / clean run</text>
  </g>

  <text x="46" y="352" fill="#8b949e" font-size="13">The gates are evaluated last and WIN over exit 1: a CI job must fail (3) even when an exploit attempt also failed —</text>
  <text x="46" y="374" fill="#8b949e" font-size="13">and all five report formats are written either way. Gate messages name the finding, so the CI log explains itself.</text>
  <text x="46" y="404" fill="#39c5cf" font-size="12">script contract: --quiet + echo $? is a complete monitoring tool · exit 3 composes with --parallel / --sarif / --baseline</text>
</svg>
