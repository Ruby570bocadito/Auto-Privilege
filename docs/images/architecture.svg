<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="520" viewBox="0 0 1240 520" font-family="Menlo,Consolas,'DejaVu Sans Mono',monospace">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#58a6ff"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="1238" height="518" rx="14" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <text x="40" y="52" fill="#e6edf3" font-size="24" font-weight="bold">AUTOPRIV — how one scan flows</text>
  <text x="40" y="78" fill="#8b949e" font-size="14">single Go binary · zero deps · everything read-only until --exploit</text>

  <!-- spine: 4 phases -->
  <g>
    <rect x="46" y="110" width="256" height="96" rx="10" fill="#161b22" stroke="#39c5cf" stroke-width="2"/>
    <text x="62" y="140" fill="#39c5cf" font-size="15" font-weight="bold">1 · SCAN</text>
    <text x="62" y="162" fill="#e6edf3" font-size="12">20 read-only scanners</text>
    <text x="62" y="180" fill="#8b949e" font-size="11">sudo, cron, caps, kernel, cred…</text>
    <text x="62" y="196" fill="#8b949e" font-size="11">risk-labeled findings</text>

    <rect x="354" y="110" width="256" height="96" rx="10" fill="#161b22" stroke="#d29922" stroke-width="2"/>
    <text x="370" y="140" fill="#d29922" font-size="15" font-weight="bold">2 · FILTER</text>
    <text x="370" y="162" fill="#e6edf3" font-size="12">--ignore SOURCES</text>
    <text x="370" y="180" fill="#e6edf3" font-size="12">--min-risk floor</text>
    <text x="370" y="198" fill="#8b949e" font-size="11">one filtered reality, applied once</text>

    <rect x="662" y="110" width="256" height="96" rx="10" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
    <text x="678" y="140" fill="#3fb950" font-size="15" font-weight="bold">3 · ENUMERATE</text>
    <text x="678" y="162" fill="#e6edf3" font-size="12">vectors + GTFOBins (75+31)</text>
    <text x="678" y="180" fill="#8b949e" font-size="11">exact command per vector</text>
    <text x="678" y="198" fill="#8b949e" font-size="11">auto vs manual, honestly</text>

    <rect x="970" y="110" width="222" height="96" rx="10" fill="#161b22" stroke="#f0883e" stroke-width="2"/>
    <text x="986" y="140" fill="#f0883e" font-size="15" font-weight="bold">4 · EXPLOIT</text>
    <text x="986" y="162" fill="#e6edf3" font-size="12">opt-in --exploit</text>
    <text x="986" y="180" fill="#8b949e" font-size="11">safest first under --risk cap</text>
    <text x="986" y="198" fill="#8b949e" font-size="11">stops at uid=0, honest if not</text>

    <line x1="302" y1="158" x2="350" y2="158" stroke="#58a6ff" stroke-width="2" marker-end="url(#ar)"/>
    <line x1="610" y1="158" x2="658" y2="158" stroke="#58a6ff" stroke-width="2" marker-end="url(#ar)"/>
    <line x1="918" y1="158" x2="966" y2="158" stroke="#58a6ff" stroke-width="2" marker-end="url(#ar)"/>
  </g>

  <!-- down arrows to outputs and gates -->
  <line x1="482" y1="206" x2="482" y2="252" stroke="#58a6ff" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="900" y1="206" x2="900" y2="252" stroke="#58a6ff" stroke-width="2" marker-end="url(#ar)"/>

  <!-- outputs band -->
  <rect x="46" y="256" width="700" height="150" rx="10" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="62" y="286" fill="#e6edf3" font-size="15" font-weight="bold">5 · REPORT + SCORE</text>
  <text x="62" y="308" fill="#8b949e" font-size="12">hardening score 0–100, deterministic — every consumer sees the same numbers</text>
  <g font-size="12">
    <rect x="62" y="324" width="118" height="30" rx="6" fill="#0d1117" stroke="#39c5cf"/><text x="121" y="343" fill="#39c5cf" text-anchor="middle">terminal</text>
    <rect x="190" y="324" width="118" height="30" rx="6" fill="#0d1117" stroke="#3fb950"/><text x="249" y="343" fill="#3fb950" text-anchor="middle">--json</text>
    <rect x="318" y="324" width="118" height="30" rx="6" fill="#0d1117" stroke="#d29922"/><text x="377" y="343" fill="#d29922" text-anchor="middle">--report md</text>
    <rect x="446" y="324" width="118" height="30" rx="6" fill="#0d1117" stroke="#f0883e"/><text x="505" y="343" fill="#f0883e" text-anchor="middle">--html</text>
    <rect x="574" y="324" width="118" height="30" rx="6" fill="#0d1117" stroke="#f85149"/><text x="633" y="343" fill="#f85149" text-anchor="middle">--sarif</text>
    <text x="62" y="386" fill="#8b949e" font-size="11">files land 0600 via atomic write · --baseline diffs new/resolved with score trajectory</text>
  </g>

  <!-- gates band -->
  <rect x="800" y="256" width="392" height="150" rx="10" fill="#161b22" stroke="#f85149" stroke-width="2"/>
  <text x="816" y="286" fill="#f85149" font-size="15" font-weight="bold">6 · CI GATES → exit 3</text>
  <g font-size="12" fill="#e6edf3">
    <text x="816" y="312">--fail-on risk — policy: surface exists</text>
    <text x="816" y="334">--fail-on-new [risk] — regression vs baseline</text>
    <text x="816" y="356">--min-score n — posture under the floor</text>
  </g>
  <text x="816" y="386" fill="#8b949e" font-size="11">gates win over exit 1 · reports are written either way</text>

  <!-- exit codes footer -->
  <g font-size="13" font-weight="bold">
    <rect x="46" y="438" width="250" height="44" rx="8" fill="#12261e" stroke="#3fb950"/>
    <text x="62" y="465" fill="#3fb950">exit 0 · root / clean run</text>
    <rect x="316" y="438" width="250" height="44" rx="8" fill="#2a2105" stroke="#d29922"/>
    <text x="332" y="465" fill="#d29922">exit 1 · exploit, no root</text>
    <rect x="586" y="438" width="250" height="44" rx="8" fill="#2d1a03" stroke="#f0883e"/>
    <text x="602" y="465" fill="#f0883e">exit 2 · usage error (fail-fast)</text>
    <rect x="856" y="438" width="336" height="44" rx="8" fill="#2d1214" stroke="#f85149"/>
    <text x="872" y="465" fill="#f85149">exit 3 · a CI gate tripped</text>
  </g>
</svg>
